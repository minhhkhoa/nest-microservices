# - docker-compose khởi dựng rabbitmq, postgresql và redis cho hệ thống microservices

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_microservices
    ports:
      - '5672:5672'   # port kết nối amqp cho các microservice
      - '15672:15672' # port giao diện quản trị web (rabbitmq management ui)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres:
    image: postgres:15-alpine
    container_name: postgres_microservices
    ports:
      - '5432:5432'   # port kết nối csdl postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # - dịch vụ redis cache lưu trữ tạm và tối ưu truy vấn
  redis:
    image: redis:7-alpine
    container_name: redis_microservices
    ports:
      - '6380:6379'   # port kết nối redis client (host 6380 -> container 6379)
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # - giao diện web quản trị cơ sở dữ liệu postgresql (adminer)
  adminer:
    image: adminer:latest
    container_name: adminer_microservices
    ports:
      - '8080:8080'   # mở trình duyệt http://localhost:8080 để xem database
    restart: unless-stopped

volumes:
  # - lưu trữ dữ liệu postgresql và redis bền vững
  postgres_data:
  redis_data:
